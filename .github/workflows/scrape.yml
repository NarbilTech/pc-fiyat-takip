name: Akakce Fiyat Guncelle

on:
  schedule:
    # Her gun saat 06:00 UTC (Turkiye 09:00)
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuel tetikleme icin

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: |
          pip install requests cloudscraper beautifulsoup4 lxml

      - name: Scraper calistir
        run: python scraper.py

      - name: Degisiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Fiyatlar guncellendi: $(date -u '+%Y-%m-%d %H:%M')"
          git push
