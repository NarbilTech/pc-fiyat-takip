name: Trendyol Fiyat Guncelle

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimlilik kur
        run: pip install requests

      - name: Scraper calistir
        run: python scraper.py

      - name: Commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git add debug_*.html || true
          git diff --staged --quiet || git commit -m "Fiyatlar guncellendi: $(date -u '+%Y-%m-%d %H:%M')"
          git push || true
